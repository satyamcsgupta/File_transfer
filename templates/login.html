<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Unlock Vault | Remote File Vault</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1220;
            color: #e5edf8;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(37, 99, 235, .2), transparent 55%),
                #0b1220;
        }

        .login-card {
            width: min(100%, 430px);
            padding: 40px;
            border: 1px solid #26354d;
            border-radius: 20px;
            background: rgba(17, 27, 44, .96);
            box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
        }

        .brand-mark {
            display: grid;
            width: 52px;
            height: 52px;
            place-items: center;
            margin-bottom: 24px;
            border-radius: 15px;
            background: #1d3768;
            color: #93c5fd;
            font-size: 25px;
        }

        h1 { margin: 0; font-size: 25px; letter-spacing: -.5px; }
        .subtitle { margin: 9px 0 28px; color: #9aabc2; line-height: 1.6; }
        label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 600; }

        .password-wrap { position: relative; }

        input {
            width: 100%;
            min-height: 50px;
            padding: 0 78px 0 14px;
            border: 1px solid #3a4b64;
            border-radius: 10px;
            outline: none;
            background: #0b1424;
            color: #f8fafc;
            font: inherit;
        }

        input:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px rgba(96, 165, 250, .17); }

        .toggle-password {
            position: absolute;
            top: 0;
            right: 0;
            height: 50px;
            padding: 0 13px;
            border: 0;
            background: transparent;
            color: #93c5fd;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .unlock-button {
            width: 100%;
            min-height: 50px;
            margin-top: 20px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background .15s ease;
        }

        .unlock-button:hover { background: #1d4ed8; }
        .error { margin: -12px 0 20px; color: #fca5a5; font-size: 14px; }

        @media (max-width: 480px) {
            .login-card { padding: 30px 24px; }
        }
    </style>
</head>
<body>
    <main class="login-card">
        <div class="brand-mark" aria-hidden="true">⌑</div>
        <h1>Remote File Vault</h1>
        <p class="subtitle">Your files, securely in one place. Enter your vault password to continue.</p>

        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}

        <form method="post" action="{{ url_for('home') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="password">Vault password</label>
            <div class="password-wrap">
                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                    autofocus
                >
                <button class="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
            </div>
            <button class="unlock-button" type="submit">Unlock Vault</button>
        </form>
    </main>
    <script>
        const passwordInput = document.getElementById("password");
        const toggleButton = document.querySelector(".toggle-password");

        toggleButton.addEventListener("click", () => {
            const showingPassword = passwordInput.type === "password";
            passwordInput.type = showingPassword ? "text" : "password";
            toggleButton.textContent = showingPassword ? "Hide" : "Show";
            toggleButton.setAttribute("aria-pressed", String(showingPassword));
        });
    </script>
</body>
</html>
