<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>My Files | Remote File Vault</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0b1220;
            color: #e5edf8;
        }

        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; }
        button, input { font: inherit; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 76px;
            padding: 0 max(24px, calc((100% - 1100px) / 2));
            border-bottom: 1px solid #1e2a3d;
            background: #101a2b;
        }

        .brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700; }
        .brand-mark {
            display: grid;
            width: 38px;
            height: 38px;
            place-items: center;
            border-radius: 11px;
            background: #1d3768;
            color: #93c5fd;
            font-size: 20px;
        }

        .logout-button {
            padding: 9px 14px;
            border: 1px solid #354660;
            border-radius: 9px;
            background: transparent;
            color: #d7e2f1;
            cursor: pointer;
        }

        .logout-button:hover { border-color: #93c5fd; color: #bfdbfe; }
        main { width: min(100% - 40px, 1000px); margin: 45px auto 70px; }
        .page-heading { margin-bottom: 28px; }
        h1 { margin: 0 0 8px; font-size: clamp(26px, 4vw, 34px); letter-spacing: -.7px; }
        .muted { color: #91a1b8; }
        .page-heading p { margin: 0; }

        .panel {
            margin-bottom: 24px;
            padding: 24px;
            border: 1px solid #26354d;
            border-radius: 15px;
            background: #111b2c;
        }

        .panel-heading { margin: 0 0 5px; font-size: 18px; }
        .panel-description { margin: 0 0 19px; font-size: 14px; }
        .upload-controls { display: flex; align-items: center; gap: 12px; }

        input[type="file"] {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #354660;
            border-radius: 9px;
            background: #0b1424;
            color: #b7c5d8;
        }

        input[type="file"]::file-selector-button {
            margin-right: 12px;
            padding: 8px 11px;
            border: 0;
            border-radius: 7px;
            background: #263a59;
            color: #e5edf8;
            cursor: pointer;
        }

        .primary-button {
            min-height: 44px;
            padding: 0 18px;
            border: 0;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .primary-button:hover { background: #1d4ed8; }
        .primary-button:disabled { opacity: .65; cursor: wait; }
        .status-message { min-height: 20px; margin: 14px 0 0; font-size: 14px; }
        .status-message[data-kind="error"] { color: #fca5a5; }
        .status-message[data-kind="success"] { color: #86efac; }

        .files-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 15px;
        }

        .files-heading h2 { margin: 0; font-size: 20px; }
        .search-input {
            width: min(100%, 310px);
            min-height: 42px;
            padding: 0 13px;
            border: 1px solid #354660;
            border-radius: 9px;
            outline: none;
            background: #0b1424;
            color: #f8fafc;
        }

        .search-input:focus { border-color: #60a5fa; }
        .table-wrap { overflow-x: auto; border: 1px solid #26354d; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 15px 17px; border-bottom: 1px solid #26354d; }
        th { background: #111b2c; color: #9aabc2; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
        td { color: #d7e2f1; font-size: 14px; }
        tbody tr:last-child td { border-bottom: 0; }
        .download-link { color: #93c5fd; font-weight: 600; text-decoration: none; }
        .download-link:hover { text-decoration: underline; }
        .delete-button {
            margin-left: 12px;
            padding: 5px 9px;
            border: 1px solid #7f303a;
            border-radius: 7px;
            background: transparent;
            color: #fca5a5;
            cursor: pointer;
        }

        .delete-button:hover { background: #48232b; }
        .empty-cell { padding: 34px 16px; color: #91a1b8; text-align: center; }

        @media (max-width: 640px) {
            .topbar { min-height: 66px; padding: 0 18px; }
            main { width: min(100% - 28px, 1000px); margin-top: 30px; }
            .panel { padding: 19px; }
            .upload-controls, .files-heading { align-items: stretch; flex-direction: column; }
            .search-input { width: 100%; }
            .upload-controls .primary-button { width: 100%; }
            th, td { padding: 12px 11px; }
            .hide-mobile { display: none; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">⌑</span>Remote File Vault</div>
        <form method="post" action="{{ url_for('logout') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="logout-button" type="submit">Log out</button>
        </form>
    </header>

    <main>
        <section class="page-heading">
            <h1>My Files</h1>
            <p class="muted">Upload, find, and securely download your files.</p>
        </section>

        <section class="panel" aria-labelledby="upload-heading">
            <h2 class="panel-heading" id="upload-heading">Upload a file</h2>
            <p class="panel-description muted">Choose a file to add it to your vault.</p>
            <form id="upload-form">
                <div class="upload-controls">
                    <input id="file-input" type="file" name="file" required>
                    <button class="primary-button" id="upload-button" type="submit">Upload file</button>
                </div>
                <p class="status-message" id="upload-status" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section aria-labelledby="files-heading">
            <div class="files-heading">
                <div>
                    <h2 id="files-heading">Your files</h2>
                    <p class="muted" id="file-count">Loading files...</p>
                </div>
                <label>
                    <span class="visually-hidden">Search files by name or File ID</span>
                    <input class="search-input" id="search-input" type="search" placeholder="Search name or File ID">
                </label>
            </div>
            <p class="status-message" id="file-status" role="status" aria-live="polite"></p>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">File name</th>
                            <th scope="col">File ID</th>
                            <th scope="col" class="hide-mobile">Uploaded</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="file-list">
                        <tr><td class="empty-cell" colspan="4">Loading your files...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <style>
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
    <script>
        const fileList = document.getElementById("file-list");
        const fileCount = document.getElementById("file-count");
        const searchInput = document.getElementById("search-input");
        const fileStatus = document.getElementById("file-status");
        const uploadForm = document.getElementById("upload-form");
        const uploadButton = document.getElementById("upload-button");
        const uploadStatus = document.getElementById("upload-status");
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
        let files = [];

        function renderFiles() {
            const query = searchInput.value.trim().toLowerCase();
            const matchingFiles = files.filter((file) =>
                file.original_filename.toLowerCase().includes(query) ||
                file.file_id.toLowerCase().includes(query)
            );

            fileCount.textContent = `${matchingFiles.length} ${matchingFiles.length === 1 ? "file" : "files"}`;
            fileList.replaceChildren();

            if (matchingFiles.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");
                cell.className = "empty-cell";
                cell.colSpan = 4;
                cell.textContent = query ? "No files match your search." : "Your vault is empty. Upload a file to get started.";
                row.append(cell);
                fileList.append(row);
                return;
            }

            for (const file of matchingFiles) {
                const row = document.createElement("tr");
                const nameCell = document.createElement("td");
                const idCell = document.createElement("td");
                const dateCell = document.createElement("td");
                const actionCell = document.createElement("td");
                const downloadLink = document.createElement("a");
                const deleteButton = document.createElement("button");

                nameCell.textContent = file.original_filename;
                idCell.textContent = file.file_id;
                dateCell.className = "hide-mobile";
                dateCell.textContent = file.uploaded_at || "";
                downloadLink.className = "download-link";
                downloadLink.href = `/download/${encodeURIComponent(file.file_id)}`;
                downloadLink.textContent = "Download";
                deleteButton.className = "delete-button";
                deleteButton.type = "button";
                deleteButton.dataset.fileId = file.file_id;
                deleteButton.textContent = "Delete";
                actionCell.append(downloadLink, deleteButton);
                row.append(nameCell, idCell, dateCell, actionCell);
                fileList.append(row);
            }
        }

        async function loadFiles() {
            const response = await fetch("/api/files", {
                headers: { "Accept": "application/json" }
            });
            if (response.status === 401) {
                window.location.assign("/");
                return;
            }
            if (!response.ok) {
                throw new Error("Unable to load files. Please refresh the page.");
            }
            files = await response.json();
            renderFiles();
        }

        searchInput.addEventListener("input", renderFiles);

        uploadForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            uploadStatus.textContent = "";
            uploadStatus.removeAttribute("data-kind");

            const selectedFile = document.getElementById("file-input").files[0];
            if (!selectedFile) return;

            const data = new FormData();
            data.append("file", selectedFile);
            uploadButton.disabled = true;
            uploadButton.textContent = "Uploading...";

            try {
                const response = await fetch("/upload", {
                    method: "POST",
                    headers: { "X-CSRF-Token": csrfToken },
                    body: data
                });
                if (response.status === 401) {
                    window.location.assign("/");
                    return;
                }

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || "Upload failed. Please try again.");
                }

                uploadStatus.dataset.kind = "success";
                uploadStatus.textContent = `Uploaded ${result.filename} — File ID: ${result.file_id}`;
                uploadForm.reset();
                await loadFiles();
            } catch (error) {
                uploadStatus.dataset.kind = "error";
                uploadStatus.textContent = error.message || "Upload failed. Please try again.";
            } finally {
                uploadButton.disabled = false;
                uploadButton.textContent = "Upload file";
            }
        });

        fileList.addEventListener("click", async (event) => {
            const button = event.target.closest("button[data-file-id]");
            if (!button || button.disabled) return;

            const file = files.find((item) => item.file_id === button.dataset.fileId);
            if (!file) return;

            const confirmed = window.confirm(
                `Permanently delete "${file.original_filename}" (${file.file_id})? This cannot be undone.`
            );
            if (!confirmed) return;

            fileStatus.textContent = "";
            fileStatus.removeAttribute("data-kind");
            button.disabled = true;

            try {
                const response = await fetch(`/api/files/${encodeURIComponent(file.file_id)}`, {
                    method: "DELETE",
                    headers: {
                        "Accept": "application/json",
                        "X-CSRF-Token": csrfToken
                    }
                });
                if (response.status === 401) {
                    window.location.assign("/");
                    return;
                }

                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.error || "Unable to delete file.");
                }

                fileStatus.dataset.kind = "success";
                fileStatus.textContent = result.message;
                await loadFiles();
            } catch (error) {
                fileStatus.dataset.kind = "error";
                fileStatus.textContent = error.message || "Unable to delete file.";
            } finally {
                button.disabled = false;
            }
        });

        loadFiles().catch((error) => {
            fileCount.textContent = "Files unavailable";
            fileList.replaceChildren();
            const row = document.createElement("tr");
            const cell = document.createElement("td");
            cell.className = "empty-cell";
            cell.colSpan = 4;
            cell.textContent = error.message;
            row.append(cell);
            fileList.append(row);
        });
    </script>
</body>
</html>
